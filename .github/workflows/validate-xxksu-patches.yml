name: Validate xxKSU patch series

on:
  workflow_dispatch:
  push:
    branches: [xxksu-sufs-jack]
    paths:
      - '.github/workflows/validate-xxksu-patches.yml'
      - 'scripts/validate_xxksu_patches.py'
      - 'patches/xxksu/**'

concurrency:
  group: xxksu-series-validation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/xxksu-sufs-jack'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout exact source snapshot
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: Apply and reverse the complete series in disposable clones
        id: check
        continue-on-error: true
        shell: bash
        run: python3 scripts/validate_xxksu_patches.py "$RUNNER_TEMP/xxksu-series-validation"
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xxksu-series-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/xxksu-series-validation/
          if-no-files-found: warn
          retention-days: 14
      - name: Checkout report publication branch
        if: always() && steps.check.outcome != 'skipped'
        uses: actions/checkout@v7
        with:
          ref: xxksu-sufs-jack
          path: .validation-publish
          fetch-depth: 0
          submodules: false
          persist-credentials: true
      - name: Commit results even when a patch check failed
        if: always() && steps.check.outcome != 'skipped'
        working-directory: .validation-publish
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/xxksu-series-validation"
          test -s "$source/report.json"
          base=audit-reports/xxksu-validation
          dest="$base/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$dest"
          cp -a "$source/." "$dest/"
          cp "$source/report.json" "$base/latest.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$base"
          if ! git diff --cached --quiet; then
            git commit -m "audit: xxKSU patch validation $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT [skip ci]"
            pushed=false
            for attempt in 1 2 3; do
              if git push origin HEAD:xxksu-sufs-jack; then
                pushed=true
                break
              fi
              git fetch origin xxksu-sufs-jack
              git rebase origin/xxksu-sufs-jack
            done
            [ "$pushed" = true ] || exit 1
          fi
          echo "Validation report: xxksu-sufs-jack:$base/latest.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Reflect validation result in workflow status
        if: always()
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        shell: bash
        run: test "$CHECK_OUTCOME" = success
