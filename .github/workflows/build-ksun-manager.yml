name: KernelSU-Next manager APK (release)

on:
  workflow_dispatch:
    inputs:
      self_hosted:
        description: 'Use the self-hosted runner (untick for GitHub-hosted)'
        required: false
        type: boolean
        default: true
      ksun_ref:
        description: 'KernelSU-Next branch, tag or commit the manager is built from.'
        required: false
        type: string
        default: 'dev'
      spoofed:
        description: 'Spoofed build (randomised package ID, like the upstream Spoofed build).'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ksun-manager-${{ inputs.self_hosted && 'selfhosted' || 'hosted' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build manager APK
    runs-on: ${{ inputs.self_hosted && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 90
    env:
      SRC: ${{ github.workspace }}/ksun
      OUT: ${{ github.workspace }}/manager-out
      CARGO_TARGET_DIR: ${{ github.workspace }}/cargo-target
      SPOOFED: ${{ inputs.spoofed }}
    steps:
      - name: Checkout build script
        uses: actions/checkout@v7
        with:
          path: ours
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/build_ksun_manager.sh

      - name: Checkout KernelSU-Next
        uses: actions/checkout@v7
        with:
          repository: KernelSU-Next/KernelSU-Next
          ref: ${{ inputs.ksun_ref }}
          path: ksun
          fetch-depth: 0

      - name: Check and install Ubuntu self-hosted dependencies
        if: inputs.self_hosted
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$*" >&2; exit 1; }
          [[ "${RUNNER_ENVIRONMENT:-}" == self-hosted ]] || fail 'Expected a self-hosted runner.'
          . /etc/os-release
          [[ "$ID" == ubuntu ]] || fail 'Automatic dependency setup supports Ubuntu only.'
          [[ "$(uname -m)" == x86_64 ]] || fail 'The Android NDK prebuilt requires x86_64 Linux.'
          packages=(build-essential ca-certificates curl git libssl-dev openssl pkg-config python3 unzip zip)
          missing=()
          for package in "${packages[@]}"; do
            status=$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)
            [[ "$status" == 'install ok installed' ]] || missing+=("$package")
          done
          if ((${#missing[@]})); then
            privilege=()
            if ((EUID != 0)); then
              command -v sudo >/dev/null || fail 'Install the missing packages manually or provide non-interactive sudo.'
              sudo -n true || fail 'Missing packages require non-interactive sudo.'
              privilege=(sudo -n)
            fi
            printf 'Installing missing packages: %s\n' "${missing[*]}"
            "${privilege[@]}" env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 update
            "${privilege[@]}" env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 install -y --no-install-recommends --no-remove "${missing[@]}"
          else
            echo 'All build dependencies are already installed.'
          fi

      - name: Prepare persistent caches
        if: inputs.self_hosted
        shell: bash
        run: |
          set -euo pipefail
          base="${XDG_CACHE_HOME:-$HOME/.cache}/a325-kernel/ksun-manager"
          mkdir -p "$base"
          exec 9>"$base/.lock"
          flock 9
          key=$( { find ksun/userspace -name Cargo.lock -exec cat {} + ; cat ours/scripts/build_ksun_manager.sh; } | sha256sum | cut -c1-16)
          target="$base/target-$key"
          mkdir -p "$target" "$base/cargo" "$base/gradle"
          find "$base" -maxdepth 1 -name 'target-*' ! -name "target-$key" -exec rm -rf {} +
          {
            echo "CARGO_HOME=$base/cargo"
            echo "CARGO_TARGET_DIR=$target"
            echo "GRADLE_USER_HOME=$base/gradle"
          } >> "$GITHUB_ENV"
          echo "$base/cargo/bin" >> "$GITHUB_PATH"

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle (cached)
        if: ${{ !inputs.self_hosted }}
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Android SDK
        if: inputs.self_hosted
        uses: android-actions/setup-android@v3

      - name: Setup NDK r29
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Cargo and target cache
        if: ${{ !inputs.self_hosted }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ${{ github.workspace }}/cargo-target
          key: ksun-manager-cargo-${{ runner.os }}-${{ hashFiles('ksun/userspace/**/Cargo.lock') }}
          restore-keys: |
            ksun-manager-cargo-${{ runner.os }}-

      - name: Build manager
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD_IN: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_IN: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_IN: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: bash ours/scripts/build_ksun_manager.sh

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: KernelSU-Next-manager${{ inputs.spoofed && '-spoofed' || '' }}
          path: |
            ${{ env.OUT }}/*.apk
            ${{ env.OUT }}/build-info.txt
          if-no-files-found: error
          retention-days: 30

      - name: Clean build output
        if: ${{ always() && inputs.self_hosted }}
        shell: bash
        run: rm -rf "$OUT" "$SRC" ours
