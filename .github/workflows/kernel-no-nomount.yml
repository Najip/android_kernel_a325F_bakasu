name: A325X Kernel (no NoMount)

# Same kernel, toolchain, configs and AnyKernel3 packaging as kernel.yml, but
# CONFIG_NOMOUNT is switched off for this build only. Nothing in the source tree
# or in build_a325n.sh is modified. Pair it with the NoMount LKM ZIP.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a325n-kernel-no-nomount-${{ github.ref }}
  cancel-in-progress: true

env:
  OUT_DIR: ${{ github.workspace }}/out-ci
  PACKAGE_DIR: ${{ github.workspace }}/package-ci
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git
  ANYKERNEL_COMMIT: af770f7b16cf8f8eb7c68614b2a693b3b361c90c

jobs:
  build:
    name: Build A325X kernel (NoMount disabled)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout kernel and submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Restore full submodule history and tags
        shell: bash
        run: |
          set -euo pipefail
          git submodule foreach --recursive '
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              git fetch --unshallow --tags --force
            else
              git fetch --tags --force
            fi
          '

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc binutils-aarch64-linux-gnu bison build-essential ca-certificates curl file flex git \
            libelf-dev libssl-dev libncurses-dev jq lz4 pahole python3 unzip xz-utils zip zlib1g-dev zstd

      - name: Install pinned AOSP Clang 14
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$RUNNER_TEMP/aosp-clang14"
          sh scripts/fetch_aosp_clang.sh "$toolchain"
          echo "TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"

      - name: Clone pinned upstream AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          parent="$(mktemp -d "$RUNNER_TEMP/AnyKernel3-A325N.XXXXXX")"
          ak3="$parent/repository"
          git clone --filter=blob:none "$ANYKERNEL_REPO" "$ak3"
          git -C "$ak3" checkout --detach "$ANYKERNEL_COMMIT"
          resolved="$(git -C "$ak3" rev-parse HEAD)"
          if [ "$resolved" != "$ANYKERNEL_COMMIT" ]; then
            echo "::error::Unexpected AnyKernel3 commit: $resolved"
            exit 1
          fi
          test -s "$GITHUB_WORKSPACE/anykernel/a325n-anykernel.sh"
          echo "AK3_DIR=$ak3" >> "$GITHUB_ENV"
          echo "ANYKERNEL_RESOLVED_COMMIT=$resolved" >> "$GITHUB_ENV"

      - name: Check unmodified BakaSU source
        shell: bash
        run: sh scripts/prepare_bakasu.sh --check

      - name: Prepare build script with NoMount disabled
        shell: bash
        run: |
          set -euo pipefail
          fragment="$RUNNER_TEMP/no-nomount.config"
          printf '# CONFIG_NOMOUNT is not set\n' > "$fragment"
          echo "NO_NOMOUNT_FRAGMENT=$fragment" >> "$GITHUB_ENV"

          # Untracked runtime copy of build_a325n.sh with one extra config fragment
          sed 's|"$ROOT/arch/arm64/configs/a325n-release.config"|& "$NO_NOMOUNT_FRAGMENT"|' \
            build_a325n.sh > .build_a325n_no_nomount.sh
          grep -q 'NO_NOMOUNT_FRAGMENT' .build_a325n_no_nomount.sh || {
            echo "::error::Could not inject the fragment; build_a325n.sh layout changed"
            exit 1
          }
          chmod +x .build_a325n_no_nomount.sh package_anykernel.sh

      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail
          NO_NOMOUNT_FRAGMENT="$NO_NOMOUNT_FRAGMENT" \
          TOOLCHAIN="$TOOLCHAIN" \
          OUT_DIR="$OUT_DIR" \
          ./.build_a325n_no_nomount.sh 2>&1 | tee "$RUNNER_TEMP/a325n-build.log"

      - name: Verify kernel outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUT_DIR/arch/arm64/boot/Image"
          test -s "$OUT_DIR/arch/arm64/boot/Image.gz"
          test -s "$OUT_DIR/drivers/kernelsu/preinit/runner.elf"
          sh scripts/prepare_bakasu.sh --check

          if grep -q '^CONFIG_NOMOUNT=' "$OUT_DIR/.config"; then
            echo '::error::CONFIG_NOMOUNT is still enabled in the final .config'
            grep '^CONFIG_NOMOUNT=' "$OUT_DIR/.config"
            exit 1
          fi
          grep -q '^# CONFIG_NOMOUNT is not set$' "$OUT_DIR/.config"
          grep -q '^CONFIG_ALWAYS_ENFORCE=y$' "$OUT_DIR/.config"

          "$TOOLCHAIN/bin/llvm-nm" --defined-only "$OUT_DIR/vmlinux" > "$OUT_DIR/symbols.txt"
          if grep -qi 'nomount\|nm_hijack' "$OUT_DIR/symbols.txt"; then
            echo '::error::NoMount symbols found in vmlinux'
            exit 1
          fi
          for symbol in ksu_setup_preinit_file ksu_preinit_runner_start ksu_preinit_runner_end \
                        susfs_set_priority_uid_filter susfs_is_priority_uid_filtered; do
            grep -q " $symbol$" "$OUT_DIR/symbols.txt"
          done

          cat "$OUT_DIR/include/config/kernel.release"
          sha256sum "$OUT_DIR/arch/arm64/boot/Image" "$OUT_DIR/arch/arm64/boot/Image.gz"

      - name: Package AnyKernel ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR"

          TOOLCHAIN="$TOOLCHAIN" \
          OUT_DIR="$OUT_DIR" \
          AK3_DIR="$AK3_DIR" \
          AK3_CONFIG="$GITHUB_WORKSPACE/anykernel/a325n-anykernel.sh" \
          ZIP_OUT_DIR="$PACKAGE_DIR" \
          ./package_anykernel.sh | tee "$RUNNER_TEMP/a325n-package.log"

          zip_path="$(find "$PACKAGE_DIR" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "$zip_path" ] || [ ! -s "$zip_path" ]; then
            echo '::error::Flashable ZIP was not created.'
            exit 1
          fi
          unzip -tq "$zip_path"
          packaged="$RUNNER_TEMP/packaged-anykernel.sh"
          unzip -p "$zip_path" anykernel.sh > "$packaged"
          grep -q '^device\.name1=a32$' "$packaged"
          grep -Eq '^BLOCK=/dev/block/by-name/boot;?$' "$packaged"

          kernel_short="$(git rev-parse --short=10 HEAD)"
          {
            echo "Kernel commit: $(git rev-parse HEAD)"
            echo "Kernel release: $(cat "$OUT_DIR/include/config/kernel.release")"
            echo "NoMount: disabled (CONFIG_NOMOUNT not set); use the NoMount LKM module ZIP"
            echo "BakaSU commit: $(git -C KernelSU rev-parse HEAD)"
            echo "Toolchain: pinned AOSP Clang 14"
            echo "AnyKernel upstream: $ANYKERNEL_REPO@$ANYKERNEL_RESOLVED_COMMIT"
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$PACKAGE_DIR/build-info.txt"
          sha256sum "$zip_path" > "$PACKAGE_DIR/SHA256SUMS.txt"
          cat "$PACKAGE_DIR/build-info.txt"

          echo "ARTIFACT_NAME=A325N-BakaSU-no-nomount-$kernel_short" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.PACKAGE_DIR }}/*.zip
            ${{ env.PACKAGE_DIR }}/SHA256SUMS.txt
            ${{ env.PACKAGE_DIR }}/build-info.txt
          if-no-files-found: error
          retention-days: 14
