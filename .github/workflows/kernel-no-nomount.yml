name: A325X Kernel (no NoMount)
on:
  workflow_dispatch:
    inputs:
      self_hosted:
        description: 'Use self-hosted runner and persistent caches (untick for GitHub-hosted)'
        type: boolean
        default: true
      perf_tuning:
        description: 'Apply optional tuning; network fixes always enabled, original GPU voltages retained'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: a325n-kernel-no-nomount-${{ github.ref }}
  cancel-in-progress: true
env:
  OUT_DIR: ${{ github.workspace }}/out-ci
  PACKAGE_DIR: ${{ github.workspace }}/package-ci
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git
  ANYKERNEL_COMMIT: af770f7b16cf8f8eb7c68614b2a693b3b361c90c
  NO_PERF_TUNING: ${{ inputs.perf_tuning && '0' || '1' }}
  APPLIED_PATCHES_FILE: ${{ runner.temp }}/no-nomount-applied-patches.txt
jobs:
  build:
    name: Build A325X kernel (NoMount disabled)
    runs-on: ${{ inputs.self_hosted && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout kernel and submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Restore full submodule history and tags
        run: |
          set -euo pipefail
          git submodule foreach --recursive '
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --unshallow --tags --force
            else
              git fetch --tags --force
            fi
          '
      - name: Install missing Ubuntu dependencies
        run: |
          set -euo pipefail
          . /etc/os-release
          [[ "$ID" == ubuntu && "$(uname -m)" == x86_64 ]] || { echo '::error::Requires x86_64 Ubuntu'; exit 1; }
          packages=(bc binutils-aarch64-linux-gnu bison build-essential ca-certificates curl file flex git libelf-dev libssl-dev libncurses-dev jq lz4 pahole python3 rsync unzip xz-utils zip zlib1g-dev zstd)
          missing=()
          for package in "${packages[@]}"; do
            status=$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)
            [[ "$status" == 'install ok installed' ]] || missing+=("$package")
          done
          if ((${#missing[@]})); then
            privilege=()
            if ((EUID != 0)); then sudo -n true; privilege=(sudo -n); fi
            "${privilege[@]}" env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 update
            "${privilege[@]}" env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 install -y --no-install-recommends --no-remove "${missing[@]}"
          fi
      - name: Prepare pinned toolchain and AnyKernel3
        env:
          SELF_HOSTED: ${{ inputs.self_hosted }}
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/no-nomount-tools"
          if [ "$SELF_HOSTED" = true ]; then base="${XDG_CACHE_HOME:-$HOME/.cache}/a325-kernel"; fi
          mkdir -p "$base"
          exec 9>"$base/.lock"
          flock 9
          key=$(sha256sum scripts/fetch_aosp_clang.sh | cut -c1-16)
          toolchain="$base/aosp-clang14-$key"
          if [ -x "$toolchain/bin/clang" ]; then
            echo "Toolchain cache: HIT ($key)"
          else
            echo "Toolchain cache: MISS ($key)"
            rm -rf "$toolchain.tmp"
            sh scripts/fetch_aosp_clang.sh "$toolchain.tmp"
            test -x "$toolchain.tmp/bin/clang"
            mv "$toolchain.tmp" "$toolchain"
          fi
          mirror="$base/AnyKernel3.git"
          [ -d "$mirror" ] || git init --bare -q "$mirror"
          if ! git -C "$mirror" cat-file -e "$ANYKERNEL_COMMIT^{commit}" 2>/dev/null; then
            git -C "$mirror" fetch -q "$ANYKERNEL_REPO" '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
          fi
          ak3="$(mktemp -d "$RUNNER_TEMP/AnyKernel3-A325N.XXXXXX")/repository"
          git clone -q "$mirror" "$ak3"
          git -C "$ak3" checkout --detach "$ANYKERNEL_COMMIT"
          resolved=$(git -C "$ak3" rev-parse HEAD)
          test "$resolved" = "$ANYKERNEL_COMMIT"
          test -s anykernel/a325n-anykernel.sh
          echo "TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"
          echo "AK3_DIR=$ak3" >> "$GITHUB_ENV"
          echo "ANYKERNEL_RESOLVED_COMMIT=$resolved" >> "$GITHUB_ENV"
      - name: Check BakaSU and apply selected patches
        run: |
          set -euo pipefail
          sh scripts/prepare_bakasu.sh --check
          sh scripts/apply_kernel_patches.sh
      - name: Prepare build script with NoMount disabled
        run: |
          set -euo pipefail
          fragment="$RUNNER_TEMP/no-nomount.config"
          printf '# CONFIG_NOMOUNT is not set\n' > "$fragment"
          echo "NO_NOMOUNT_FRAGMENT=$fragment" >> "$GITHUB_ENV"
          sed 's|"$ROOT/arch/arm64/configs/a325n-release.config"|& "$NO_NOMOUNT_FRAGMENT"|' build_a325n.sh > .build_a325n_no_nomount.sh
          grep -q NO_NOMOUNT_FRAGMENT .build_a325n_no_nomount.sh
          chmod +x .build_a325n_no_nomount.sh package_anykernel.sh
      - name: Build kernel
        run: |
          set -euo pipefail
          ./.build_a325n_no_nomount.sh 2>&1 | tee "$RUNNER_TEMP/a325n-build.log"
      - name: Verify kernel outputs
        run: |
          set -euo pipefail
          test -s "$OUT_DIR/arch/arm64/boot/Image"
          test -s "$OUT_DIR/arch/arm64/boot/Image.gz"
          test -s "$OUT_DIR/drivers/kernelsu/preinit/runner.elf"
          sh scripts/prepare_bakasu.sh --check
          if grep -q '^CONFIG_NOMOUNT=' "$OUT_DIR/.config"; then echo '::error::CONFIG_NOMOUNT is still enabled'; exit 1; fi
          grep -q '^# CONFIG_NOMOUNT is not set$' "$OUT_DIR/.config"
          grep -q '^CONFIG_ALWAYS_ENFORCE=y$' "$OUT_DIR/.config"
          "$TOOLCHAIN/bin/llvm-nm" --defined-only "$OUT_DIR/vmlinux" > "$OUT_DIR/symbols.txt"
          if grep -qi 'nomount\|nm_hijack' "$OUT_DIR/symbols.txt"; then echo '::error::NoMount symbols found in vmlinux'; exit 1; fi
          for symbol in ksu_setup_preinit_file ksu_preinit_runner_start ksu_preinit_runner_end susfs_set_priority_uid_filter susfs_is_priority_uid_filtered; do
            grep -q " $symbol$" "$OUT_DIR/symbols.txt"
          done
          if grep -q susfs_parse_priority_app_strings KernelSU/kernel/supercall/dispatch.c KernelSU/kernel/manager/pkg_observer.c 2>/dev/null; then
            grep -q ' susfs_parse_priority_app_strings$' "$OUT_DIR/symbols.txt"
          fi
          cat "$OUT_DIR/include/config/kernel.release"
          sha256sum "$OUT_DIR/arch/arm64/boot/Image" "$OUT_DIR/arch/arm64/boot/Image.gz"
      - name: Package AnyKernel ZIP
        env:
          PERF_TUNING: ${{ inputs.perf_tuning }}
          SELF_HOSTED: ${{ inputs.self_hosted }}
        run: |
          set -euo pipefail
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR"
          AK3_CONFIG="$GITHUB_WORKSPACE/anykernel/a325n-anykernel.sh" ZIP_OUT_DIR="$PACKAGE_DIR" ./package_anykernel.sh | tee "$RUNNER_TEMP/a325n-package.log"
          zip_path=$(find "$PACKAGE_DIR" -maxdepth 1 -type f -name '*.zip' -print -quit)
          test -s "$zip_path"
          unzip -tq "$zip_path"
          unzip -p "$zip_path" anykernel.sh > "$RUNNER_TEMP/packaged-anykernel.sh"
          grep -q '^device\.name1=a32$' "$RUNNER_TEMP/packaged-anykernel.sh"
          grep -Eq '^BLOCK=/dev/block/by-name/boot;?$' "$RUNNER_TEMP/packaged-anykernel.sh"
          patch_list=$(paste -sd, "$APPLIED_PATCHES_FILE")
          kernel_short=$(git rev-parse --short=10 HEAD)
          {
            echo "Kernel commit: $(git rev-parse HEAD)"
            echo "Kernel release: $(cat "$OUT_DIR/include/config/kernel.release")"
            echo "Kernel patches applied: ${patch_list:-none}"
            echo "Optional tuning: $PERF_TUNING"
            echo 'Network fixes: enabled'
            echo 'GPU voltage restoration: applied last'
            echo 'NoMount: disabled; use the NoMount LKM module ZIP'
            echo "Self-hosted runner: $SELF_HOSTED"
            echo "BakaSU commit: $(git -C KernelSU rev-parse HEAD)"
            echo 'Toolchain: pinned AOSP Clang 14'
            echo "AnyKernel upstream: $ANYKERNEL_REPO@$ANYKERNEL_RESOLVED_COMMIT"
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$PACKAGE_DIR/build-info.txt"
          sha256sum "$zip_path" > "$PACKAGE_DIR/SHA256SUMS.txt"
          cat "$PACKAGE_DIR/build-info.txt"
          cat "$PACKAGE_DIR/build-info.txt" >> "$GITHUB_STEP_SUMMARY"
          echo "ARTIFACT_NAME=A325N-BakaSU-no-nomount-$kernel_short-tuning-$PERF_TUNING" >> "$GITHUB_ENV"
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.PACKAGE_DIR }}/*.zip
            ${{ env.PACKAGE_DIR }}/SHA256SUMS.txt
            ${{ env.PACKAGE_DIR }}/build-info.txt
          if-no-files-found: error
          retention-days: 14
      - name: Clean build output
        if: always()
        run: rm -rf "$OUT_DIR" "$PACKAGE_DIR" .build_a325n_no_nomount.sh
