name: SUSFS port - isolated xxKSU manual-hook review
on:
  workflow_dispatch:
    inputs:
      self_hosted:
        description: Run on the self-hosted runner
        type: boolean
        default: false
      target_branch:
        description: 'NEW review branch only; existing targets are refused'
        type: string
        default: xxksu-manual-susfs-port
permissions:
  contents: write
concurrency:
  group: xxksu-susfs-port-${{ inputs.target_branch }}
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/xxksu-sufs-jack'
    runs-on: ${{ inputs.self_hosted && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout boot-tested source branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Validate new isolated target and locked sources
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          case "$TARGET_BRANCH" in
            xxksu-manual-susfs-port|xxksu-manual-susfs-port-*) ;;
            *) echo '::error::Refusing target outside isolated manual-port namespace'; exit 1 ;;
          esac
          git check-ref-format --branch "$TARGET_BRANCH"
          refs=$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH")
          test -z "$refs" || { echo '::error::Target already exists; no overwrite allowed'; exit 1; }
          test "$(git -C KernelSU rev-parse HEAD)" = 1b8ce9e15a9402aa2192aed5d381366cf2150f0f
          test "$(git -C NonGKI_Kernel_Build_2nd rev-parse HEAD)" = bbe032eb06c50d24a9207bf2ece5e25cf2460bd0
          python3 -c "import ast; ast.parse(open('scripts/port_xxksu_manual.py').read())"
      - name: Generate direct manual-hook review port
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          python3 scripts/port_xxksu_manual.py 2>&1 | tee "$RUNNER_TEMP/xxksu-manual-port.log"
      - name: Commit only to a NEW review branch
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$TARGET_BRANCH"
          git add -A -- fs drivers/input/input.c security/security.c include/linux/xxksu_parent_bridge.h include/linux/xxksu_manual_hooks.h Kconfig arch/arm64/configs/ksu-a325n-common.config patches/xxksu/source-lock.json scripts/prepare_xxksu.py build_xxksu.sh package_xxksu.sh .github/workflows/kernel.yml .susfs-port/PORT_NOTES.md
          git diff --cached --check
          {
            echo "Isolated manual-hook review target: $TARGET_BRANCH"
            git diff --cached --stat
            cat .susfs-port/PORT_NOTES.md
          } | tee -a "$GITHUB_STEP_SUMMARY"
          git commit -m 'xxKSU: stage direct manual hooks on isolated review branch'
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:" origin "HEAD:refs/heads/$TARGET_BRANCH"
      - name: Retain generation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xxksu-manual-port-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/xxksu-manual-port.log
            .susfs-port/PORT_NOTES.md
          if-no-files-found: warn
          retention-days: 14
