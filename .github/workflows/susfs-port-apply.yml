name: SUSFS 2.4.0 - Jack core and xxKSU manual port
on:
  workflow_dispatch:
    inputs:
      self_hosted:
        description: Run on the self-hosted runner
        type: boolean
        default: false
      target_branch:
        description: NEW isolated branch; existing targets are refused
        type: string
        default: xxksu-manual-susfs-port-jack240
permissions:
  contents: write
concurrency:
  group: xxksu-susfs-port-${{ inputs.target_branch }}
  cancel-in-progress: false
env:
  JACK_COMMIT: 26f2313be61f7a8603a50b2dcd12171495a79d27
jobs:
  apply:
    if: github.ref == 'refs/heads/xxksu-sufs-jack'
    runs-on: ${{ inputs.self_hosted && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        id: checkout
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Validate isolated target and inherited builder
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          case "$TARGET_BRANCH" in
            xxksu-manual-susfs-port|xxksu-manual-susfs-port-*) ;;
            *) echo '::error::Target outside isolated namespace'; exit 1 ;;
          esac
          git check-ref-format --branch "$TARGET_BRANCH"
          refs=$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH")
          test -z "$refs" || { echo '::error::Target exists; choose another suffix'; exit 1; }
          test "$(git config -f .gitmodules submodule.NonGKI_Kernel_Build_2nd.url)" = https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git
          grep -Fq "startsWith(github.ref, 'refs/heads/xxksu-manual-susfs-port-')" .github/workflows/kernel.yml
          grep -Fq 'git push origin "HEAD:$GITHUB_REF"' .github/workflows/kernel.yml
          python3 -c "import ast; [ast.parse(open(p).read()) for p in ('scripts/port_xxksu_manual.py', 'scripts/port_jack_susfs.py')]"
      - name: Materialize locked xxKSU integration first
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          python3 scripts/port_xxksu_manual.py 2>&1 | tee "$RUNNER_TEMP/xxksu-manual-port.log"
          git restore --source=HEAD --staged --worktree -- .github/workflows/
      - name: Select pinned latest Jack patches and port the core and hooks
        run: |
          set -euo pipefail
          git -C NonGKI_Kernel_Build_2nd fetch origin "$JACK_COMMIT"
          git -C NonGKI_Kernel_Build_2nd checkout --detach "$JACK_COMMIT"
          test "$(git -C NonGKI_Kernel_Build_2nd rev-parse HEAD)" = "$JACK_COMMIT"
          python3 scripts/port_jack_susfs.py 2>&1 | tee "$RUNNER_TEMP/jack-susfs-port.log"
      - name: Commit complete review target including the Jack gitlink
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$TARGET_BRANCH"
          git diff --exit-code HEAD -- .github/workflows/
          git add -A -- . ':!.github/workflows' ':!KernelSU'
          git diff --cached --check
          git diff --cached --exit-code -- .github/workflows/ KernelSU
          test "$(git ls-files --stage NonGKI_Kernel_Build_2nd | awk '{print $1}')" = 160000
          test "$(git ls-files --stage NonGKI_Kernel_Build_2nd | awk '{print $2}')" = "$JACK_COMMIT"
          subject=$(head -n 1 .susfs-port/COMMIT_SUBJECT)
          test -n "$subject"
          git commit -m "$subject"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:" origin "HEAD:refs/heads/$TARGET_BRANCH"
          {
            echo "### Generated target: $TARGET_BRANCH"
            echo "Jack gitlink: $JACK_COMMIT"
            echo 'Run kernel.yml from this target. Source generation is not compile or device validation.'
            cat .susfs-port/PORT_NOTES.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain generation logs and hunk audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xxksu-jack-susfs-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/xxksu-manual-port.log
            ${{ runner.temp }}/jack-susfs-port.log
            .susfs-port/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish failed port diagnostics to repository
        if: failure() && steps.checkout.outcome == 'success'
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          branch="xxksu-susfs-failure-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          scratch=$(mktemp -d "$RUNNER_TEMP/xxksu-failure-publish.XXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          publish="$scratch/tree"
          export DIAGNOSTICS_DIR="$publish/susfs-port-failure"
          mkdir -p "$DIAGNOSTICS_DIR/hunks"
          python3 - <<'PY'
          import json, os, pathlib, shutil, subprocess
          out = pathlib.Path(os.environ['DIAGNOSTICS_DIR'])
          report = pathlib.Path('.susfs-port')
          if report.is_dir():
              for name in ('jack-source.json', 'PORT_NOTES.md'):
                  source = report / name
                  if source.is_file() and not source.is_symlink():
                      shutil.copyfile(source, out / name)
              for source in sorted(report.glob('*.hunk-*.patch')):
                  if source.is_file() and not source.is_symlink():
                      shutil.copyfile(source, out / 'hunks' / source.name)
          for name in ('xxksu-manual-port.log', 'jack-susfs-port.log'):
              source = pathlib.Path(os.environ['RUNNER_TEMP']) / name
              if source.is_file():
                  shutil.copyfile(source, out / name)
          actual = subprocess.run(['git', '-C', 'NonGKI_Kernel_Build_2nd', 'rev-parse', 'HEAD'], capture_output=True, text=True)
          metadata = {'run_url': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'], 'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'workflow_commit': os.environ['GITHUB_SHA'], 'source_ref': os.environ['GITHUB_REF'], 'target_branch': os.environ['TARGET_BRANCH'], 'intended_jack_commit': os.environ['JACK_COMMIT'], 'checked_out_jack_commit': actual.stdout.strip() if actual.returncode == 0 else None, 'rejected_hunk_count': len(list((out / 'hunks').glob('*.patch'))), 'status': 'FAILED; diagnostics only, not a usable kernel target'}
          (out / 'RUN.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY
          git diff --binary HEAD -- fs include kernel block mm security drivers/input/input.c Kconfig arch/arm64/configs/ksu-a325n-common.config patches/xxksu/source-lock.json > "$DIAGNOSTICS_DIR/partial-source.diff"
          printf '%s\n' '# Failed xxKSU / Jack SUSFS port diagnostics' '' 'This branch contains diagnostics only, not a kernel source tree.' 'See susfs-port-failure/RUN.json, jack-source.json, hunks/, logs and partial-source.diff.' > "$publish/README.md"
          export GIT_INDEX_FILE="$scratch/index"
          git read-tree --empty
          git --work-tree="$publish" add -f -- README.md susfs-port-failure
          tree=$(git write-tree)
          commit=$(printf 'diagnostics: failed SUSFS port run %s attempt %s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | git commit-tree "$tree")
          git push --force-with-lease="refs/heads/$branch:" origin "$commit:refs/heads/$branch"
          {
            echo '### Failed-port diagnostics published'
            echo "Branch: $branch"
            echo 'Directory: susfs-port-failure/'
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$branch/susfs-port-failure"
            echo 'The port remains failed; no partial kernel target was approved by this diagnostics step.'
          } >> "$GITHUB_STEP_SUMMARY"
