name: SUSFS 2.4.0 port - build review branch (Jack 4.14)

# Builds a REVIEW branch (default: susfs-2.4.0-port) from this kernel tree. It never changes the
# branch you run it from. Step 1 of the port:
#   - fs/susfs.c, include/linux/susfs.h and include/linux/susfs_def.h are taken from Jack's patch
#   - Jack's priority-UID-filter block is removed, because fs/susfs_priority.c (your own, tested
#     implementation) is kept
#   - Jack's credential switch (commit_creds + setup_selinux) is replaced by override_creds(ksu_cred),
#     the same method fs/susfs_priority.c uses, since KernelSU-Next legacy may not export setup_selinux
#   - the priority macros, struct and prototypes your tree uses are put back into the headers
#   - fs/Makefile gets the SUSFS_KERNEL_READ_NEW detection
# Every replacement is asserted: the job fails instead of guessing when a pattern is not found.
# Notes about what was done are committed to .susfs-port/PORT_NOTES.md on the review branch.

on:
  workflow_dispatch:
    inputs:
      self_hosted:
        description: 'Run on the self-hosted runner (default: GitHub-hosted runner)'
        required: false
        type: boolean
        default: false
      kernel_ref:
        description: 'Kernel branch, tag or commit used as the base. Blank = branch you run this from'
        required: false
        type: string
        default: ''
      jack_ref:
        description: 'NonGKI_Kernel_Build_2nd branch, tag or commit. Blank = commit pinned by the submodule'
        required: false
        type: string
        default: ''
      patch_path:
        description: 'Patch path inside NonGKI_Kernel_Build_2nd'
        required: false
        type: string
        default: 'Patches/Patch/susfs_patch_to_4.14.patch'
      target_branch:
        description: 'Review branch to create or overwrite'
        required: false
        type: string
        default: 'susfs-2.4.0-port'

permissions:
  contents: write

concurrency:
  group: susfs-port-apply-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    name: Build the SUSFS 2.4.0 review branch
    runs-on: ${{ inputs.self_hosted && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - name: Checkout kernel and submodules
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.kernel_ref || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Select Jack's commit
        shell: bash
        env:
          JACK_REF: ${{ inputs.jack_ref }}
        run: |
          set -euo pipefail
          if [ -n "$JACK_REF" ]; then
            git -C NonGKI_Kernel_Build_2nd fetch origin "$JACK_REF"
            git -C NonGKI_Kernel_Build_2nd checkout --detach FETCH_HEAD
          fi
          git -C NonGKI_Kernel_Build_2nd log -1 --format='%H %cI %s'

      - name: Generate the port
        shell: bash
        env:
          PATCH_PATH: ${{ inputs.patch_path }}
        run: |
          set -euo pipefail
          patch_file="NonGKI_Kernel_Build_2nd/$PATCH_PATH"
          test -s "$patch_file" || { echo "::error::Patch not found: $patch_file"; exit 1; }
          test -f fs/susfs_priority.c || { echo "::error::fs/susfs_priority.c not found in this tree"; exit 1; }
          python3 - "$patch_file" <<'PY'
          import os, re, sys

          patch = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          parts = [p for p in re.split(r'(?m)^(?=diff --git )', patch) if p.startswith('diff --git ')]
          new = {}
          for s in parts:
              f = re.match(r'diff --git a/(\S+) b/(\S+)', s).group(2)
              if '\nnew file mode' not in s.split('\n@@')[0]:
                  continue
              lines = []
              started = False
              for line in s.split('\n'):
                  if line.startswith('@@'):
                      started = True
                      continue
                  if started and line.startswith('+'):
                      lines.append(line[1:])
              new[f] = '\n'.join(lines) + '\n'

          notes = ['# SUSFS 2.4.0 port notes (step 1)', '']

          def fail(msg):
              print('::error::' + msg)
              sys.exit(1)

          for need in ('fs/susfs.c', 'include/linux/susfs.h', 'include/linux/susfs_def.h'):
              if need not in new:
                  fail(need + ' is not created by the patch')

          def remove_blocks(text, start_re):
              out = []
              count = 0
              lines = text.split('\n')
              i = 0
              while i < len(lines):
                  if re.match(start_re, lines[i]):
                      depth = 0
                      while i < len(lines):
                          l = lines[i].strip()
                          if re.match(r'#\s*if', l):
                              depth += 1
                          elif re.match(r'#\s*endif', l):
                              depth -= 1
                          i += 1
                          if depth == 0:
                              break
                      count += 1
                      continue
                  out.append(lines[i])
                  i += 1
              return '\n'.join(out), count

          # ---- fs/susfs.c ----
          c = new['fs/susfs.c']
          c, n = remove_blocks(c, r'^#ifdef CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER\b')
          if n < 1:
              fail('no CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER block found in Jack fs/susfs.c')
          notes.append('- fs/susfs.c: removed %d CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER block(s); fs/susfs_priority.c stays the implementation.' % n)

          pat = re.compile(r'/\*\n \* Switches the selinux domain.*?static void susfs_restore_creds\(struct cred \*orig_cred\) \{.*?\n\}\n', re.S)
          repl_lines = [
              '/*',
              ' * Overrides the credentials of the current task with the KernelSU ones, so that the',
              ' * data paths of the apps can be accessed despite of the selinux restrictions.',
              ' * Same method as fs/susfs_priority.c (override_creds(ksu_cred)); it does not need',
              ' * setup_selinux() and does not commit new credentials to the calling task.',
              ' * Returns the saved credentials on success, NULL on failure.',
              ' */',
              'static const struct cred *susfs_switch_to_ksu_domain(void) {',
              '\tstruct cred *cred = READ_ONCE(ksu_cred);',
              '\tconst struct cred *saved;',
              '',
              '\tif (!cred)',
              '\t\treturn NULL;',
              '\tsaved = override_creds(cred);',
              '\tif (!susfs_is_current_ksu_domain()) {',
              '\t\trevert_creds(saved);',
              '\t\treturn NULL;',
              '\t}',
              '\treturn saved;',
              '}',
              '',
              '/* Restores the credentials saved by susfs_switch_to_ksu_domain(). */',
              'static void susfs_restore_creds(const struct cred *saved) {',
              '\tif (saved)',
              '\t\trevert_creds(saved);',
              '}',
              '',
          ]
          repl = '\n'.join(repl_lines)
          c, n = pat.subn(lambda m: repl, c, count=1)
          if n != 1:
              fail('could not find susfs_switch_to_ksu_domain / susfs_restore_creds in Jack fs/susfs.c')
          notes.append('- fs/susfs.c: susfs_switch_to_ksu_domain() now uses override_creds(ksu_cred) instead of prepare_creds + setup_selinux + commit_creds.')

          c, n = re.subn(r'(?<!const )struct cred \*orig_cred = NULL;', 'const struct cred *orig_cred = NULL;', c)
          if n < 1:
              fail('no orig_cred declarations to retype in Jack fs/susfs.c')
          notes.append('- fs/susfs.c: %d orig_cred declaration(s) changed to const struct cred *.' % n)

          for bad in ('commit_creds(', 'abort_creds(', 'prepare_creds(', 'setup_selinux("'):
              if bad in c:
                  fail('unexpected leftover in fs/susfs.c: ' + bad)

          if 'susfs_get_data_path' not in c:
              c = c.rstrip('\n') + '\n\n/* kept from the previous in-tree SUSFS */\nint susfs_get_data_path(struct path *path) {\n\treturn kern_path("/data", LOOKUP_FOLLOW, path);\n}\n'
              notes.append('- fs/susfs.c: susfs_get_data_path() re-added (it existed in your tree, Jack removed it).')

          left = [(i + 1, l.strip()) for i, l in enumerate(c.split('\n')) if 'priority' in l.lower()]
          notes.append('')
          notes.append('## Lines in the new fs/susfs.c that still mention priority (check these)')
          notes.extend('- %d: `%s`' % (i, l[:140]) for i, l in left[:60])

          # ---- include/linux/susfs.h ----
          h = new['include/linux/susfs.h']
          h, n = remove_blocks(h, r'^#ifdef CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER\b')
          notes.append('')
          notes.append('- include/linux/susfs.h: removed %d Jack priority block(s).' % n)
          anchor = '#include <linux/statfs.h>\n'
          if h.count(anchor) != 1:
              fail('anchor #include <linux/statfs.h> not found exactly once in Jack susfs.h')
          macros = '\n#ifndef getname_safe\n#define getname_safe(name) (name == NULL ? ERR_PTR(-EINVAL) : getname(name))\n#endif\n#ifndef putname_safe\n#define putname_safe(name) (IS_ERR(name) ? NULL : putname(name))\n#endif\n'
          h = h.replace(anchor, anchor + macros, 1)
          if not h.rstrip().endswith('#endif'):
              fail('Jack susfs.h does not end with the header guard #endif')
          idx = h.rstrip().rfind('#endif')
          prio = '/* priority uid filter (implemented in fs/susfs_priority.c) */\nstruct st_susfs_priority_uid_filter {\n\tchar app_strings[SUSFS_APP_STR_BUF_SIZE];\n\tint err;\n};\n\nint susfs_set_priority_uid_filter(void __user *arg);\nbool susfs_is_priority_uid_filtered(uid_t uid);\n\n'
          h = h[:idx] + prio + h[idx:]
          notes.append('- include/linux/susfs.h: re-added getname_safe/putname_safe and the in-tree priority struct and prototypes.')

          # ---- include/linux/susfs_def.h ----
          d = new['include/linux/susfs_def.h']
          anchor = '#define SUSFS_UID_FILTER_BITMAP_LEN BITS_TO_LONGS(SUSFS_UID_FILTER_UID_NUM)\n'
          if d.count(anchor) != 1:
              fail('anchor SUSFS_UID_FILTER_BITMAP_LEN not found exactly once in Jack susfs_def.h')
          extra = '#define SUSFS_PRIORITY_UID_FILTER_MIN_UID 10000\n#define SUSFS_PRIORITY_UID_FILTER_MAX_UID 19999\n#define SUSFS_PRIORITY_UID_FILTER_UID_NUM 10000\n'
          d = d.replace(anchor, anchor + extra, 1)
          notes.append('- include/linux/susfs_def.h: re-added SUSFS_PRIORITY_UID_FILTER_* macros used by fs/susfs_priority.c.')

          # ---- fs/Makefile ----
          mk = open('fs/Makefile', encoding='utf-8').read()
          line = 'obj-$(CONFIG_KSU_SUSFS) += susfs.o susfs_priority.o susfs_ksu_glue.o\n'
          if mk.count(line) != 1:
              fail('expected SUSFS obj line not found exactly once in fs/Makefile')
          if 'SUSFS_KERNEL_READ_NEW' in mk:
              fail('fs/Makefile already has SUSFS_KERNEL_READ_NEW')
          add = '# susfs: kernel_read() changed signature in v4.14; detect by signature, not by version.\nifeq ($(shell grep -q "ssize_t kernel_read" $(srctree)/fs/read_write.c $(srctree)/fs/exec.c 2>/dev/null; echo $$?),0)\nCFLAGS_susfs.o += -DSUSFS_KERNEL_READ_NEW\nendif\n'
          mk = mk.replace(line, line + add, 1)
          notes.append('- fs/Makefile: added the SUSFS_KERNEL_READ_NEW detection after the SUSFS object line.')

          open('fs/susfs.c', 'w').write(c)
          open('include/linux/susfs.h', 'w').write(h)
          open('include/linux/susfs_def.h', 'w').write(d)
          open('fs/Makefile', 'w').write(mk)
          os.makedirs('.susfs-port', exist_ok=True)
          open('.susfs-port/PORT_NOTES.md', 'w').write('\n'.join(notes) + '\n')
          PY

      - name: Commit the review branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          branch="$TARGET_BRANCH"
          case "$branch" in
            ''|common|main|master|ksun-susfs-JackA1ltman|susfs-delta-report)
              echo "::error::Refusing to overwrite branch '$branch'"; exit 1 ;;
          esac
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git add fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h fs/Makefile .susfs-port/PORT_NOTES.md
          {
            echo "## SUSFS 2.4.0 port, step 1"
            echo
            echo "- Review branch: $branch"
            echo "- Base kernel commit: $(git rev-parse HEAD)"
            echo "- Jack commit: $(git -C NonGKI_Kernel_Build_2nd rev-parse HEAD)"
            echo
            git diff --cached --stat
            echo
            cat .susfs-port/PORT_NOTES.md
          } | tee -a "$GITHUB_STEP_SUMMARY"
          git commit -q -m "SUSFS v2.4.0 port step 1: Jack's susfs.c and headers, in-tree priority filter kept"
          git push --force origin "HEAD:refs/heads/$branch"
          echo "Pushed review branch $branch" | tee -a "$GITHUB_STEP_SUMMARY"
