name: BakaSU Kernel (selectable tuning)
on:
  workflow_dispatch:
    inputs:
      perf_tuning:
        description: 'Apply optional CPU/GPU, charging, zram and USB tuning (network fixes always enabled)'
        type: boolean
        default: false
      self_hosted:
        description: 'Use self-hosted runner and persistent toolchain cache'
        type: boolean
        default: true
      nomount:
        description: 'Build NoMount into the kernel (untick to use the NoMount LKM)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: bakasu-selectable-${{ github.ref }}
  cancel-in-progress: true
env:
  OUT_DIR: ${{ github.workspace }}/out-ci
  PACKAGE_DIR: ${{ github.workspace }}/package-ci
  NO_PERF_TUNING: ${{ inputs.perf_tuning && '0' || '1' }}
  APPLIED_PATCHES_FILE: ${{ runner.temp }}/bakasu-selectable-patches.txt
  ANYKERNEL_COMMIT: af770f7b16cf8f8eb7c68614b2a693b3b361c90c
jobs:
  build:
    runs-on: ${{ inputs.self_hosted && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Restore submodule history
        shell: bash
        run: |
          set -euo pipefail
          git submodule foreach --recursive 'if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --unshallow --tags; else git fetch --tags; fi'
      - name: Install missing dependencies
        shell: bash
        run: |
          set -euo pipefail
          packages=(bc binutils-aarch64-linux-gnu bison build-essential ca-certificates curl file flex git libelf-dev libssl-dev libncurses-dev jq lz4 pahole python3 rsync unzip xz-utils zip zlib1g-dev zstd)
          missing=()
          for p in "${packages[@]}"; do
            [ "$(dpkg-query -W -f='${Status}' "$p" 2>/dev/null || true)" = 'install ok installed' ] || missing+=("$p")
          done
          if ((${#missing[@]})); then
            sudo -n apt-get -o DPkg::Lock::Timeout=300 update
            sudo -n apt-get -o DPkg::Lock::Timeout=300 install -y --no-install-recommends "${missing[@]}"
          fi
      - name: Prepare toolchain and AnyKernel
        shell: bash
        env:
          SELF_HOSTED: ${{ inputs.self_hosted }}
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/bakasu-tools"
          if [ "$SELF_HOSTED" = true ]; then base="${XDG_CACHE_HOME:-$HOME/.cache}/a325-kernel"; fi
          mkdir -p "$base"
          exec 9>"$base/.lock"
          flock 9
          key=$(sha256sum scripts/fetch_aosp_clang.sh | cut -c1-16)
          toolchain="$base/aosp-clang14-$key"
          if [ ! -x "$toolchain/bin/clang" ]; then
            rm -rf "$toolchain.tmp"
            sh scripts/fetch_aosp_clang.sh "$toolchain.tmp"
            mv "$toolchain.tmp" "$toolchain"
          fi
          mirror="$base/AnyKernel3.git"
          [ -d "$mirror" ] || git init --bare -q "$mirror"
          if ! git -C "$mirror" cat-file -e "$ANYKERNEL_COMMIT^{commit}" 2>/dev/null; then
            git -C "$mirror" fetch https://github.com/osm0sis/AnyKernel3.git '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
          fi
          ak3="$(mktemp -d "$RUNNER_TEMP/bakasu-ak3.XXXXXX")/repository"
          git clone -q "$mirror" "$ak3"
          git -C "$ak3" checkout --detach "$ANYKERNEL_COMMIT"
          echo "TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          echo "AK3_DIR=$ak3" >> "$GITHUB_ENV"
      - name: Apply selected patches
        run: |
          sh scripts/prepare_bakasu.sh --check
          sh scripts/apply_kernel_patches.sh
      - name: Build kernel
        shell: bash
        env:
          NOMOUNT: ${{ inputs.nomount }}
        run: |
          set -euo pipefail
          script=./build_a325n.sh
          if [ "$NOMOUNT" != true ]; then
            fragment="$RUNNER_TEMP/no-nomount.config"
            printf '# CONFIG_NOMOUNT is not set\n' > "$fragment"
            export NO_NOMOUNT_FRAGMENT="$fragment"
            sed 's|"$ROOT/arch/arm64/configs/a325n-release.config"|& "$NO_NOMOUNT_FRAGMENT"|' build_a325n.sh > .build_a325n_selectable.sh
            grep -q NO_NOMOUNT_FRAGMENT .build_a325n_selectable.sh
            script=./.build_a325n_selectable.sh
          fi
          sh "$script" 2>&1 | tee "$RUNNER_TEMP/bakasu-selectable-build.log"
      - name: Verify and package
        shell: bash
        env:
          NOMOUNT: ${{ inputs.nomount }}
          PERF_TUNING: ${{ inputs.perf_tuning }}
        run: |
          set -euo pipefail
          test -s "$OUT_DIR/arch/arm64/boot/Image.gz"
          test -s "$OUT_DIR/drivers/kernelsu/preinit/runner.elf"
          grep -q '^CONFIG_ALWAYS_ENFORCE=y$' "$OUT_DIR/.config"
          if [ "$NOMOUNT" = true ]; then grep -q '^CONFIG_NOMOUNT=y$' "$OUT_DIR/.config"; else grep -q '^# CONFIG_NOMOUNT is not set$' "$OUT_DIR/.config"; fi
          sh scripts/prepare_bakasu.sh --check
          mkdir -p "$PACKAGE_DIR"
          AK3_CONFIG="$GITHUB_WORKSPACE/anykernel/a325n-anykernel.sh" ZIP_OUT_DIR="$PACKAGE_DIR" sh package_anykernel.sh
          zip_path=$(find "$PACKAGE_DIR" -maxdepth 1 -name '*.zip' -type f -print -quit)
          test -s "$zip_path"
          unzip -tq "$zip_path"
          unzip -p "$zip_path" anykernel.sh > "$RUNNER_TEMP/bakasu-anykernel.sh"
          grep -q '^device\.name1=a32$' "$RUNNER_TEMP/bakasu-anykernel.sh"
          grep -Eq '^BLOCK=/dev/block/by-name/boot;?$' "$RUNNER_TEMP/bakasu-anykernel.sh"
          {
            echo "Kernel commit: $(git rev-parse HEAD)"
            echo "BakaSU commit: $(git -C KernelSU rev-parse HEAD)"
            echo "Optional tuning: $PERF_TUNING"
            echo "Built-in NoMount: $NOMOUNT"
            echo 'Network patch: enabled'
            echo 'GPU voltage restoration: applied after tuning'
            cat "$APPLIED_PATCHES_FILE"
          } > "$PACKAGE_DIR/build-info.txt"
          sha256sum "$zip_path" > "$PACKAGE_DIR/SHA256SUMS.txt"
          cat "$PACKAGE_DIR/build-info.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: BakaSU-tuning-${{ inputs.perf_tuning && 'on' || 'off' }}-nomount-${{ inputs.nomount }}-${{ github.run_id }}
          path: ${{ env.PACKAGE_DIR }}/*
          if-no-files-found: error
          retention-days: 14
      - name: Clean output
        if: always()
        run: rm -rf "$OUT_DIR" "$PACKAGE_DIR" .build_a325n_selectable.sh
