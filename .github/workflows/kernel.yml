name: A325X Kernel
run-name: xxKSU compile validation (${{ github.ref_name }})

on:
  push:
    branches: [xxksu-sufs-jack]
    paths:
      - '.github/workflows/kernel.yml'
      - 'build_xxksu.sh'
      - 'scripts/prepare_xxksu.py'
      - 'scripts/fetch_aosp_clang.sh'
      - 'scripts/aosp_clang14.conf'
      - 'patches/xxksu/**'
      - 'arch/arm64/configs/**'
      - 'KernelSU'
      - 'NonGKI_Kernel_Build_2nd'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xxksu-compile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: xxKSU guarded compile and link
    if: github.ref == 'refs/heads/xxksu-sufs-jack'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout pinned sources
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Initialize external build paths
        run: |
          set -euo pipefail
          echo "OUT_DIR=$RUNNER_TEMP/out-xxksu" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=$RUNNER_TEMP/aosp-clang14" >> "$GITHUB_ENV"
          echo "BUILD_LOG=$RUNNER_TEMP/xxksu-build.log" >> "$GITHUB_ENV"
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - name: Install dependencies
        id: dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc binutils-aarch64-linux-gnu bison build-essential ca-certificates curl file flex git libelf-dev libssl-dev libncurses-dev jq lz4 pahole python3 unzip xz-utils zip zlib1g-dev zstd

      - name: Check script syntax
        id: syntax
        run: |
          set -euo pipefail
          sh -n build_xxksu.sh
          python3 -c "import ast; ast.parse(open('scripts/prepare_xxksu.py').read())"

      - name: Prepare patches and compile kernel
        id: compile
        run: |
          set -uo pipefail
          set +e
          sh build_xxksu.sh 2>&1 | tee "$BUILD_LOG"
          codes=("${PIPESTATUS[@]}")
          echo "exit_code=${codes[0]}" >> "$GITHUB_OUTPUT"
          echo "log_exit_code=${codes[1]}" >> "$GITHUB_OUTPUT"
          if [ "${codes[0]}" -ne 0 ]; then exit "${codes[0]}"; fi
          exit "${codes[1]}"

      - name: Record result and split logs
        id: report
        if: always() && steps.checkout.outcome == 'success'
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          COMPILE_EXIT_CODE: ${{ steps.compile.outputs.exit_code }}
          LOG_EXIT_CODE: ${{ steps.compile.outputs.log_exit_code }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path('audit-reports/xxksu-build')
          run = os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          directory = root / run
          directory.mkdir(parents=True, exist_ok=True)
          log = pathlib.Path(os.environ['RUNNER_TEMP']) / 'xxksu-build.log'
          data = log.read_bytes() if log.exists() else b'No build log: inspect dependency, syntax, or setup steps.\n'
          parts = []
          for index, start in enumerate(range(0, len(data), 180000), 1):
              path = directory / ('build.part-%04d.txt' % index)
              path.write_text(data[start:start+180000].decode('utf-8', errors='replace'))
              parts.append(str(path))
          warnings = [line for line in data.decode('utf-8', errors='replace').splitlines() if 'warning:' in line.lower()]
          (directory / 'warnings.txt').write_text('\n'.join(warnings) + '\n')
          lock = json.loads(pathlib.Path('patches/xxksu/source-lock.json').read_text())
          result = {'status': 'PASS' if os.environ['COMPILE_OUTCOME'] == 'success' else 'NOT_PASS',
                    'compile_outcome': os.environ['COMPILE_OUTCOME'],
                    'exit_code': os.environ.get('COMPILE_EXIT_CODE', ''),
                    'log_exit_code': os.environ.get('LOG_EXIT_CODE', ''),
                    'dependencies_outcome': os.environ['DEPENDENCIES_OUTCOME'],
                    'syntax_outcome': os.environ['SYNTAX_OUTCOME'],
                    'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                    'source_lock': lock,
                    'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                    'run_url': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
                    'scope': 'Guarded patch preparation and compile/link checks only. Warnings require review. No boot, root, SUSFS-runtime, LKM, APK, packaging or release validation.',
                    'warning_line_count': len(warnings), 'log_parts': parts}
          text = json.dumps(result, indent=2) + '\n'
          (directory / 'result.json').write_text(text)
          (root / 'latest.json').write_text(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### xxKSU compile validation\n```json\n' + text + '```\n')
          PY

      - name: Upload diagnostics and non-release output
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: xxksu-compile-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            audit-reports/xxksu-build/${{ github.run_id }}-${{ github.run_attempt }}/
            ${{ env.BUILD_LOG }}
            ${{ env.OUT_DIR }}/.config
            ${{ env.OUT_DIR }}/arch/arm64/boot/Image*
            ${{ env.OUT_DIR }}/System.map
            ${{ env.OUT_DIR }}/xxksu-source.json
            ${{ env.OUT_DIR }}/toolchain-source.txt
            ${{ env.OUT_DIR }}/vmlinux-header.txt
            ${{ env.OUT_DIR }}/xxksu-symbols.txt
            ${{ env.OUT_DIR }}/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Commit only build reports
        if: always() && steps.report.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- audit-reports/xxksu-build
          if ! git diff --cached --quiet; then
            git commit -m "audit: xxKSU compile $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT [skip ci]"
            git push origin HEAD:refs/heads/xxksu-sufs-jack
          fi
