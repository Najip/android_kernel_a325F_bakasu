name: A325X Kernel
run-name: xxKSU experimental kernel build (${{ github.ref_name }})

on:
  push:
    branches: [xxksu-sufs-jack]
    paths:
      - '.github/workflows/kernel.yml'
      - 'build_xxksu.sh'
      - 'package_xxksu.sh'
      - 'anykernel/a325n-anykernel.sh'
      - 'scripts/**'
      - 'patches/xxksu/**'
      - 'arch/arm64/configs/**'
      - 'kernel/**'
      - 'fs/**'
      - 'include/**'
      - 'KernelSU'
      - 'NonGKI_Kernel_Build_2nd'
  workflow_dispatch:
    inputs:
      self_hosted:
        description: 'Run on the self-hosted runner (untick for a GitHub-hosted runner)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
concurrency:
  group: xxksu-compile-${{ github.ref }}
  cancel-in-progress: false
env:
  SELF_HOSTED: ${{ github.event_name == 'workflow_dispatch' && inputs.self_hosted }}

jobs:
  build:
    name: Build and package experimental xxKSU kernel
    if: github.ref == 'refs/heads/xxksu-sufs-jack'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.self_hosted && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 120
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout pinned sources
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Initialize external build paths
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/xxksu-builder.XXXXXX")
          echo "BUILD_WORK=$work" >> "$GITHUB_ENV"
          echo "OUT_DIR=$work/out" >> "$GITHUB_ENV"
          echo "PACKAGE_DIR=$work/package" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=$RUNNER_TEMP/aosp-clang14" >> "$GITHUB_ENV"
          echo "BUILD_LOG=$work/build.log" >> "$GITHUB_ENV"
          echo "PACKAGE_LOG=$work/package.log" >> "$GITHUB_ENV"
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - name: Install dependencies (KSUN-style self-hosted checks)
        id: dependencies
        run: |
          set -euo pipefail
          packages=(bc binutils-aarch64-linux-gnu bison build-essential ca-certificates curl file flex git libelf-dev libssl-dev libncurses-dev jq lz4 pahole python3 unzip xz-utils zip zlib1g-dev zstd util-linux)
          if [[ "$SELF_HOSTED" != true ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${packages[@]}"
            exit 0
          fi
          fail() { echo "::error::$*" >&2; exit 1; }
          [[ "${RUNNER_ENVIRONMENT:-}" == self-hosted ]] || fail 'Expected a self-hosted runner.'
          . /etc/os-release
          [[ "$ID" == ubuntu ]] || fail 'Automatic dependency setup supports Ubuntu only.'
          [[ "$(uname -m)" == x86_64 ]] || fail 'The AOSP Clang prebuilt requires x86_64 Linux.'
          missing=()
          for package in "${packages[@]}"; do
            status=$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)
            [[ "$status" == 'install ok installed' ]] || missing+=("$package")
          done
          if ((${#missing[@]})); then
            privilege=()
            if ((EUID != 0)); then
              command -v sudo >/dev/null || fail 'Install missing packages or provide non-interactive sudo.'
              sudo -n true || fail 'Missing packages require non-interactive sudo.'
              privilege=(sudo -n)
            fi
            "${privilege[@]}" env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 update
            "${privilege[@]}" env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3 install -y --no-install-recommends --no-remove "${missing[@]}"
          else
            echo 'All build dependencies are already installed.'
          fi

      - name: Install pinned AOSP Clang 14 (self-hosted cache)
        if: env.SELF_HOSTED == 'true'
        run: |
          set -euo pipefail
          cache="${XDG_CACHE_HOME:-$HOME/.cache}/a325-kernel/xxksu"
          mkdir -p "$cache"
          exec 9>"$cache/.lock"
          flock 9
          key=$(sha256sum scripts/fetch_aosp_clang.sh scripts/aosp_clang14.conf | sha256sum | cut -c1-16)
          toolchain="$cache/aosp-clang14-$key"
          if [ -x "$toolchain/bin/clang" ]; then
            echo "Toolchain cache: HIT ($key)"
          else
            echo "Toolchain cache: MISS ($key)"
          fi
          AOSP_CLANG_CACHE="$cache/archives" sh scripts/fetch_aosp_clang.sh "$toolchain"
          echo "TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"

      - name: Check script syntax
        id: syntax
        run: |
          set -euo pipefail
          sh -n build_xxksu.sh
          sh -n package_xxksu.sh
          python3 -c "import ast; ast.parse(open('scripts/prepare_xxksu.py').read())"

      - name: Prepare patches and compile kernel
        id: compile
        run: |
          set -uo pipefail
          set +e
          sh build_xxksu.sh 2>&1 | tee "$BUILD_LOG"
          codes=("${PIPESTATUS[@]}")
          echo "exit_code=${codes[0]}" >> "$GITHUB_OUTPUT"
          echo "log_exit_code=${codes[1]}" >> "$GITHUB_OUTPUT"
          if [ "${codes[0]}" -ne 0 ]; then exit "${codes[0]}"; fi
          exit "${codes[1]}"

      - name: Package and verify experimental AnyKernel3 ZIP
        id: package
        run: |
          set -uo pipefail
          set +e
          sh package_xxksu.sh 2>&1 | tee "$PACKAGE_LOG"
          codes=("${PIPESTATUS[@]}")
          echo "exit_code=${codes[0]}" >> "$GITHUB_OUTPUT"
          if [ "${codes[0]}" -ne 0 ]; then exit "${codes[0]}"; fi
          exit "${codes[1]}"

      - name: Record build and package results
        id: report
        if: always() && steps.checkout.outcome == 'success'
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          COMPILE_EXIT_CODE: ${{ steps.compile.outputs.exit_code }}
          LOG_EXIT_CODE: ${{ steps.compile.outputs.log_exit_code }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          PACKAGE_EXIT_CODE: ${{ steps.package.outputs.exit_code }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path('audit-reports/xxksu-build')
          run = os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          directory = root / run
          directory.mkdir(parents=True, exist_ok=True)
          parts, warnings = [], []
          for kind, variable in [('build', 'BUILD_LOG'), ('package', 'PACKAGE_LOG')]:
              log = pathlib.Path(os.environ.get(variable) or '/nonexistent-xxksu-log')
              data = log.read_bytes() if log.is_file() else b'No log: step did not run.\n'
              for index, start in enumerate(range(0, len(data), 18000), 1):
                  path = directory / ('%s.part-%04d.txt' % (kind, index))
                  path.write_text(data[start:start+18000].decode('utf-8', errors='replace'))
                  parts.append(str(path))
              warnings.extend(line for line in data.decode('utf-8', errors='replace').splitlines() if 'warning:' in line.lower())
          (directory / 'warnings.txt').write_text('\n'.join(warnings) + '\n')
          result = {'status': 'PASS' if os.environ['COMPILE_OUTCOME'] == 'success' and os.environ['PACKAGE_OUTCOME'] == 'success' else 'NOT_PASS',
                    'compile_outcome': os.environ['COMPILE_OUTCOME'], 'exit_code': os.environ.get('COMPILE_EXIT_CODE', ''),
                    'log_exit_code': os.environ.get('LOG_EXIT_CODE', ''),
                    'package_outcome': os.environ['PACKAGE_OUTCOME'], 'package_exit_code': os.environ.get('PACKAGE_EXIT_CODE', ''),
                    'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                    'source_lock': json.loads(pathlib.Path('patches/xxksu/source-lock.json').read_text()),
                    'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                    'run_url': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
                    'scope': 'Experimental kernel ZIP. Compile/link and archive checks only. Boot, root, SUSFS runtime and LKM remain untested. No release or deployment.',
                    'warning_line_count': len(warnings), 'log_parts': parts}
          text = json.dumps(result, indent=2) + '\n'
          (directory / 'result.json').write_text(text)
          (root / 'latest.json').write_text(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### xxKSU experimental kernel builder\n```json\n' + text + '```\n')
          PY

      - name: Upload verified experimental kernel package
        if: success() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: A325X-xxKSU-experimental-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PACKAGE_DIR }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: xxksu-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            audit-reports/xxksu-build/${{ github.run_id }}-${{ github.run_attempt }}/
            ${{ env.BUILD_LOG }}
            ${{ env.PACKAGE_LOG }}
            ${{ env.OUT_DIR }}/.config
            ${{ env.OUT_DIR }}/arch/arm64/boot/Image*
            ${{ env.OUT_DIR }}/System.map
            ${{ env.OUT_DIR }}/xxksu-source.json
            ${{ env.OUT_DIR }}/toolchain-source.txt
            ${{ env.OUT_DIR }}/vmlinux-header.txt
            ${{ env.OUT_DIR }}/xxksu-symbols.txt
            ${{ env.OUT_DIR }}/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Commit only build reports
        if: always() && steps.report.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- audit-reports/xxksu-build
          if ! git diff --cached --quiet; then
            git commit -m "audit: xxKSU build $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT [skip ci]"
            git push origin HEAD:refs/heads/xxksu-sufs-jack
          fi

      - name: Clean build output (self-hosted)
        if: always() && env.SELF_HOSTED == 'true'
        run: |
          if [[ -n "${BUILD_WORK:-}" && "$BUILD_WORK" == "$RUNNER_TEMP"/xxksu-builder.* ]]; then
            rm -rf -- "$BUILD_WORK"
          fi
