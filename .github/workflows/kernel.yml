name: A325X Kernel
run-name: A325X xxKSU kernel (${{ github.ref_name }})

# Builds the flashable AnyKernel3 ZIP.
# - Runs by itself after every change on the default branch (GitHub runner).
# - Run it by hand from the Actions tab for any branch. Tick "Publish a GitHub
#   Release" to put the ZIP on the Releases page.
on:
  push:
    branches: [common]
    paths:
      - '.github/workflows/kernel.yml'
      - 'build_xxksu.sh'
      - 'package_xxksu.sh'
      - 'sources.json'
      - 'anykernel/**'
      - 'scripts/**'
      - 'patches/**'
      - 'arch/arm64/**'
      - 'block/**'
      - 'drivers/**'
      - 'fs/**'
      - 'include/**'
      - 'kernel/**'
      - 'mm/**'
      - 'net/**'
      - 'security/**'
  workflow_dispatch:
    inputs:
      self_hosted:
        description: 'Run on your own PC runner (untick to use a GitHub runner)'
        type: boolean
        default: true
      perf_tuning:
        description: 'Apply the optional performance tuning patch'
        type: boolean
        default: false
      publish_release:
        description: 'Publish a GitHub Release with the ZIP'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: a325x-kernel-${{ github.ref }}
  cancel-in-progress: false

env:
  SELF_HOSTED: ${{ github.event_name == 'workflow_dispatch' && inputs.self_hosted }}
  PERF_TUNING: ${{ github.event_name == 'workflow_dispatch' && inputs.perf_tuning }}

jobs:
  build:
    name: Build xxKSU + SUSFS kernel
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.self_hosted && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 120
    outputs:
      release_tag: ${{ steps.package.outputs.release_tag }}
      artifact: ${{ steps.package.outputs.artifact }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Prepare build folders
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/a325x-build.XXXXXX")
          {
            echo "BUILD_WORK=$work"
            echo "OUT_DIR=$work/out"
            echo "PACKAGE_DIR=$work/package"
            echo "TOOLCHAIN=$RUNNER_TEMP/aosp-clang14"
            echo "BUILD_LOG=$work/build.log"
            echo "PACKAGE_LOG=$work/package.log"
          } >> "$GITHUB_ENV"
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - name: Install build dependencies
        run: |
          set -euo pipefail
          packages=(bc binutils-aarch64-linux-gnu bison build-essential ca-certificates curl file flex git libelf-dev libssl-dev libncurses-dev jq lz4 pahole python3 unzip xz-utils zip zlib1g-dev zstd util-linux)
          if [[ "$SELF_HOSTED" != true ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${packages[@]}"
            exit 0
          fi
          fail() { echo "::error::$*" >&2; exit 1; }
          . /etc/os-release
          [[ "$ID" == ubuntu ]] || fail 'Automatic dependency setup supports Ubuntu only.'
          [[ "$(uname -m)" == x86_64 ]] || fail 'The AOSP Clang prebuilt requires x86_64 Linux.'
          missing=()
          for package in "${packages[@]}"; do
            status=$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)
            [[ "$status" == 'install ok installed' ]] || missing+=("$package")
          done
          if ((${#missing[@]})); then
            privilege=()
            if ((EUID != 0)); then
              sudo -n true || fail "Missing packages need non-interactive sudo: ${missing[*]}"
              privilege=(sudo -n)
            fi
            "${privilege[@]}" env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 update
            "${privilege[@]}" env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 install -y --no-install-recommends --no-remove "${missing[@]}"
          else
            echo 'All build dependencies are already installed.'
          fi

      - name: Use cached AOSP Clang 14 (own PC runner)
        if: env.SELF_HOSTED == 'true'
        run: |
          set -euo pipefail
          cache="${XDG_CACHE_HOME:-$HOME/.cache}/a325-kernel/xxksu"
          mkdir -p "$cache"
          exec 9>"$cache/.lock"
          flock 9
          key=$(sha256sum scripts/fetch_aosp_clang.sh scripts/aosp_clang14.conf | sha256sum | cut -c1-16)
          toolchain="$cache/aosp-clang14-$key"
          AOSP_CLANG_CACHE="$cache/archives" sh scripts/fetch_aosp_clang.sh "$toolchain"
          echo "TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Download xxKSU, apply patches and compile
        id: compile
        run: |
          set -euo pipefail
          sh build_xxksu.sh 2>&1 | tee "$BUILD_LOG"

      - name: Package AnyKernel3 ZIP
        id: package
        run: |
          set -euo pipefail
          sh package_xxksu.sh 2>&1 | tee "$PACKAGE_LOG"
          cp "$OUT_DIR/kernel-patches.json" "$OUT_DIR/applied-patches.txt" "$PACKAGE_DIR/"
          echo "Optional tuning: $PERF_TUNING" >> "$PACKAGE_DIR/build-info.txt"
          echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$PACKAGE_DIR/build-info.txt"
          zip=$(basename "$(ls "$PACKAGE_DIR"/*.zip)")
          name="${zip%.zip}"
          [[ "$PERF_TUNING" == true ]] && name="$name-tuning"
          echo "artifact=$name" >> "$GITHUB_OUTPUT"
          echo "release_tag=${name#A325X-}" >> "$GITHUB_OUTPUT"
          {
            echo "### Kernel ZIP ready: \`$name\`"
            echo '```'
            cat "$PACKAGE_DIR/build-info.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload kernel ZIP
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ env.PACKAGE_DIR }}/
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs for troubleshooting
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            ${{ env.BUILD_LOG }}
            ${{ env.PACKAGE_LOG }}
            ${{ env.OUT_DIR }}/.config
            ${{ env.OUT_DIR }}/System.map
            ${{ env.OUT_DIR }}/xxksu-source.json
            ${{ env.OUT_DIR }}/kernel-patches.json
            ${{ env.OUT_DIR }}/toolchain-source.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Clean build folder (own PC runner)
        if: always() && env.SELF_HOSTED == 'true'
        run: |
          if [[ -n "${BUILD_WORK:-}" && "$BUILD_WORK" == "$RUNNER_TEMP"/a325x-build.* ]]; then
            rm -rf -- "$BUILD_WORK"
          fi
          rm -rf -- KernelSU

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download kernel ZIP
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(release/*.zip release/SHA256SUMS.txt release/build-info.txt)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "A325X $TAG" --notes-file release/build-info.txt
          fi
