name: Build fgetpriority LKM (4.14) (Self-Hosted)

# Stub on the default branch. GitHub only lists workflow_dispatch workflows that
# exist on the default branch; the real workflow lives on the
# nomount-lkm-sync-up-patch branch.
# Choose branch "nomount-lkm-sync-up-patch" when running this from the Actions tab.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stub:
    name: Select the nomount-lkm-sync-up-patch branch
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Wrong branch
        run: |
          echo "::error::This is only a stub. Re-run this workflow and select branch 'nomount-lkm-sync-up-patch'."
          exit 1
