name: Setup xxKSU submodule

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: setup-xxksu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    if: github.ref == 'refs/heads/xxksu-sufs-jack'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
      - name: Switch KernelSU to backslashxx/KernelSU master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config -f .gitmodules submodule.KernelSU.url https://github.com/backslashxx/KernelSU.git
          git config -f .gitmodules submodule.KernelSU.branch master
          git submodule sync -- KernelSU
          git submodule update --init --remote -- KernelSU
          test -f KernelSU/kernel/Kconfig
          git add .gitmodules KernelSU
          if git diff --cached --quiet; then
            echo 'xxKSU is already up to date.'
            exit 0
          fi
          git diff --cached --submodule=short
          git commit -m 'kernelsu: switch to backslashxx KernelSU master [skip ci]'
          git push origin HEAD:xxksu-sufs-jack
