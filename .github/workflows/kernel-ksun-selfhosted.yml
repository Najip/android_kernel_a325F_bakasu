name: A325X Kernel (KernelSU-Next legacy) (Self-Hosted)

# Stub on the default branch. GitHub only lists workflow_dispatch workflows that
# exist on the default branch; the real workflow lives on ksun-susfs-JackA1ltman.
# Choose branch "ksun-susfs-JackA1ltman" under "Use workflow from" when running it.

on:
  workflow_dispatch:
    inputs:
      nomount:
        description: 'Build NoMount into the kernel (CONFIG_NOMOUNT=y). Untick for the no-NoMount kernel.'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  stub:
    name: Select the ksun-susfs-JackA1ltman branch
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Wrong branch
        run: |
          echo "::error::This is only a stub. Re-run this workflow and select branch 'ksun-susfs-JackA1ltman'."
          exit 1
