name: Audit xxKSU SUSFS integration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xxksu-susfs-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/xxksu-sufs-jack'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout existing kernel and pinned KernelSU
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - name: Checkout pinned xxKSU separately
        uses: actions/checkout@v7
        with:
          repository: backslashxx/KernelSU
          ref: 1b8ce9e15a9402aa2192aed5d381366cf2150f0f
          path: .audit-xxksu
          persist-credentials: false
      - name: Collect integration evidence without modifying sources
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/xxksu-susfs-audit"
          mkdir -p "$report"
          {
            printf 'Kernel: '; git rev-parse HEAD
            printf 'Current KernelSU: '; git -C KernelSU rev-parse HEAD
            printf 'Target xxKSU: '; git -C .audit-xxksu rev-parse HEAD
            printf 'Run: %s/%s/actions/runs/%s (attempt %s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            cat .gitmodules
          } > "$report/revisions.txt"
          pattern='ksu_|KSU_|susfs|SUSFS'
          set +e
          git grep -n -I -C 5 -E "$pattern" -- fs security kernel drivers/input include/linux include/uapi arch/arm64/configs > "$report/kernel-hook-map.txt"
          status=$?
          set -e
          ((status <= 1)) || exit "$status"
          for entry in 'KernelSU:current-kernelsu' '.audit-xxksu:target-xxksu'; do
            source=${entry%%:*}
            label=${entry#*:}
            set +e
            git -C "$source" grep -n -I -C 5 -E 'susfs|SUSFS|ksu_handle_|ksu_cred|setup_selinux|is_ksu_domain|on_post_fs_data|on_boot_completed|on_module_mounted|ioctl|prctl' -- kernel > "$report/$label-interfaces.txt"
            status=$?
            set -e
            ((status <= 1)) || exit "$status"
            git -C "$source" archive --format=tar HEAD kernel | gzip > "$report/$label-kernel-source.tar.gz"
          done
          git archive --format=tar HEAD fs/exec.c fs/open.c fs/stat.c fs/read_write.c fs/readdir.c fs/susfs.c security/security.c include/linux/susfs.h include/linux/susfs_def.h arch/arm64/configs/ksu-a325n-common.config | gzip > "$report/kernel-integration-source.tar.gz"
          {
            echo '### xxKSU/SUSFS source audit'
            echo 'Evidence collection only: no compatibility or build success is implied.'
            echo 'The publication job commits text evidence only; it does not change kernel sources or submodule pins.'
            echo
            cat "$report/revisions.txt"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload source audit
        uses: actions/upload-artifact@v7
        with:
          name: xxksu-susfs-audit-${{ github.sha }}
          path: ${{ runner.temp }}/xxksu-susfs-audit/
          if-no-files-found: error
          retention-days: 14
  publish:
    name: Commit readable audit reports
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: xxksu-sufs-jack
          fetch-depth: 0
          submodules: false
          persist-credentials: true
      - uses: actions/download-artifact@v7
        with:
          name: xxksu-susfs-audit-${{ github.sha }}
          path: ${{ runner.temp }}/audit-input
      - name: Split text evidence into readable repository files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          source = Path(os.environ['RUNNER_TEMP']) / 'audit-input'
          root = Path('audit-reports/xxksu')
          dest = root / (os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          dest.mkdir(parents=True, exist_ok=True)
          manifest = {'source_commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'run_url': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'], 'note': 'Source audit only, not a successful build or compatibility validation.', 'files': []}
          reports = sorted(source.glob('*.txt'))
          if not reports:
              raise SystemExit('No text reports found')
          for path in reports:
              data = path.read_text()
              parts = []
              for index, offset in enumerate(range(0, max(len(data), 1), 10000), 1):
                  part = dest / (path.stem + '.part-%04d.txt' % index)
                  part.write_text(data[offset:offset + 10000])
                  parts.append(str(part))
              manifest['files'].append({'source_name': path.name, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest(), 'parts': parts})
          text = json.dumps(manifest, indent=2) + '\n'
          (dest / 'manifest.json').write_text(text)
          (root / 'latest.json').write_text(text)
          PY
      - name: Commit reports without changing integration sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- audit-reports/xxksu
          if git diff --cached --quiet; then
            echo 'Reports already committed.'
            exit 0
          fi
          git commit -m "audit: record xxKSU SUSFS evidence $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT [skip ci]"
          pushed=false
          for attempt in 1 2 3; do
            if git push origin HEAD:xxksu-sufs-jack; then
              pushed=true
              break
            fi
            git fetch origin xxksu-sufs-jack
            git rebase origin/xxksu-sufs-jack
          done
          [ "$pushed" = true ] || { echo '::error::Could not push audit reports'; exit 1; }
          echo 'Readable reports committed to xxksu-sufs-jack: audit-reports/xxksu/latest.json' >> "$GITHUB_STEP_SUMMARY"
