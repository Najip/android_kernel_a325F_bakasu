name: SUSFS patch delta report (Jack 4.14, dry-run)

# Report only: nothing is modified or committed. For every file in Jack's SUSFS patch it
# counts the lines the patch ADDS, checks how many of them already exist in this kernel
# tree (matched by content and count, ignoring whitespace and trivial lines such as braces),
# and lists the ones that are missing. Tick "self_hosted" to use the self-hosted runner.

on:
  workflow_dispatch:
    inputs:
      self_hosted:
        description: 'Run on the self-hosted runner (default: GitHub-hosted runner)'
        required: false
        type: boolean
        default: false
      kernel_ref:
        description: 'Kernel branch, tag or commit. Blank = branch you run this from'
        required: false
        type: string
        default: ''
      jack_ref:
        description: 'NonGKI_Kernel_Build_2nd branch, tag or commit. Blank = commit pinned by the submodule'
        required: false
        type: string
        default: ''
      patch_path:
        description: 'Patch path inside NonGKI_Kernel_Build_2nd'
        required: false
        type: string
        default: 'Patches/Patch/susfs_patch_to_4.14.patch'

permissions:
  contents: read

concurrency:
  group: susfs-patch-delta-${{ inputs.self_hosted && 'selfhosted' || 'hosted' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Report lines missing from Jack's SUSFS patch
    runs-on: ${{ inputs.self_hosted && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - name: Checkout kernel and submodules
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.kernel_ref || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Select Jack's commit
        shell: bash
        env:
          JACK_REF: ${{ inputs.jack_ref }}
        run: |
          set -euo pipefail
          if [ -n "$JACK_REF" ]; then
            git -C NonGKI_Kernel_Build_2nd fetch origin "$JACK_REF"
            git -C NonGKI_Kernel_Build_2nd checkout --detach FETCH_HEAD
          fi
          git -C NonGKI_Kernel_Build_2nd log -1 --format='%H %cI %s'

      - name: Compare added lines with the tree
        shell: bash
        env:
          PATCH_PATH: ${{ inputs.patch_path }}
        run: |
          set -euo pipefail
          patch_file="NonGKI_Kernel_Build_2nd/$PATCH_PATH"
          test -s "$patch_file" || { echo "::error::Patch not found: $patch_file"; exit 1; }
          mkdir -p report/missing
          python3 - "$patch_file" <<'PY'
          import os, re, sys
          from collections import Counter

          def norm(l):
              return re.sub(r'\s+', ' ', l.strip())

          TRIV = re.compile(r'^(\{|\}|\};?|#else|#endif.*|else|break;|return;|/\*|\*/|\*)$')

          def trivial(n):
              return len(n) < 4 or bool(TRIV.match(n))

          text = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          parts = [p for p in re.split(r'(?m)^(?=diff --git )', text) if p.startswith('diff --git ')]
          rows = []
          combined = []
          for s in parts:
              f = re.match(r'diff --git a/(\S+) b/(\S+)', s).group(2)
              is_new = '\nnew file mode' in s.split('\n@@')[0]
              exists = os.path.isfile(f)
              tree = Counter()
              if exists:
                  for l in open(f, encoding='utf-8', errors='replace'):
                      n = norm(l)
                      if n and not trivial(n):
                          tree[n] += 1
              avail = Counter(tree)
              avail_rm = Counter(tree)
              nh = nadd = present = rm_total = rm_present = 0
              out = []
              for line in s.split('\n'):
                  if line.startswith('@@'):
                      nh += 1
                      out.append([line, []])
                      continue
                  if nh == 0:
                      continue
                  if line.startswith('+'):
                      n = norm(line[1:])
                      if not n or trivial(n):
                          continue
                      nadd += 1
                      if avail[n] > 0:
                          avail[n] -= 1
                          present += 1
                      else:
                          out[-1][1].append(line[1:])
                  elif line.startswith('-'):
                      n = norm(line[1:])
                      if not n or trivial(n):
                          continue
                      rm_total += 1
                      if avail_rm[n] > 0:
                          avail_rm[n] -= 1
                          rm_present += 1
              missing = nadd - present
              if not exists and not is_new:
                  status = 'FILE MISSING'
              elif nadd == 0:
                  status = 'NO ADDITIONS'
              elif missing == 0:
                  status = 'IN TREE'
              elif present == 0:
                  status = 'ALL MISSING'
              else:
                  status = 'PARTIAL'
              rows.append((f, nh, nadd, present, missing, rm_total, rm_present, status))
              if missing:
                  body = [f'### {f}  ({missing} of {nadd} added lines missing)']
                  for hdr, ml in out:
                      if ml:
                          body.append(hdr)
                          body.extend('+' + x for x in ml)
                  chunk = '\n'.join(body) + '\n'
                  open('report/missing/' + f.replace('/', '__') + '.txt', 'w').write(chunk)
                  combined.append(chunk)

          open('report/missing-all.txt', 'w').write('\n'.join(combined))

          with open('report/summary.md', 'w') as m:
              m.write('| File | Hunks | Added lines | Already in tree | Missing | Removed lines still in tree | Status |\n')
              m.write('|---|---|---|---|---|---|---|\n')
              for f, nh, na, pr, mi, rt, rp, st in rows:
                  m.write(f'| `{f}` | {nh} | {na} | {pr} | {mi} | {rp} of {rt} | {st} |\n')
              counts = Counter(r[7] for r in rows)
              m.write('\n' + ', '.join(f'{k}: {v}' for k, v in sorted(counts.items())))
              m.write(f'\n\nTotal added lines: {sum(r[2] for r in rows)}, missing: {sum(r[4] for r in rows)}\n')

          jack = re.findall(r'(?m)^\+#define SUSFS_VERSION "([^"]*)"', text)
          tree_ver = ''
          if os.path.isfile('include/linux/susfs.h'):
              mm = re.search(r'#define SUSFS_VERSION "([^"]*)"', open('include/linux/susfs.h').read())
              tree_ver = mm.group(1) if mm else ''
          open('report/version.txt', 'w').write(
              f"In-tree SUSFS_VERSION: {tree_ver or 'not found'}\nPatch SUSFS_VERSION: {jack[0] if jack else 'not set by this patch'}\n")
          PY

      - name: Write run summary
        shell: bash
        env:
          PATCH_PATH: ${{ inputs.patch_path }}
        run: |
          set -euo pipefail
          {
            echo "## SUSFS patch delta"
            echo
            echo "- Kernel commit: $(git rev-parse HEAD)"
            echo "- Jack commit: $(git -C NonGKI_Kernel_Build_2nd rev-parse HEAD)"
            echo "- Patch: $PATCH_PATH"
            sed 's/^/- /' report/version.txt
            echo
            cat report/summary.md
          } | tee -a "$GITHUB_STEP_SUMMARY" > report/header.md

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: susfs-patch-delta
          path: report/
          if-no-files-found: error
          retention-days: 14

      - name: Clean report (self-hosted)
        if: ${{ always() && inputs.self_hosted }}
        shell: bash
        run: rm -rf report
