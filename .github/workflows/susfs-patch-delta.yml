name: SUSFS patch delta report (Jack 4.14, dry-run)

# Stub on the default branch. GitHub only lists workflow_dispatch workflows that
# exist on the default branch; the real workflow lives on ksun-susfs-JackA1ltman.
# Choose branch "ksun-susfs-JackA1ltman" under "Use workflow from" when running it.

on:
  workflow_dispatch:
    inputs:
      self_hosted:
        description: 'Run on the self-hosted runner (default: GitHub-hosted runner)'
        required: false
        type: boolean
        default: false
      kernel_ref:
        description: 'Kernel branch, tag or commit. Blank = branch you run this from'
        required: false
        type: string
        default: ''
      jack_ref:
        description: 'NonGKI_Kernel_Build_2nd branch, tag or commit. Blank = commit pinned by the submodule'
        required: false
        type: string
        default: ''
      patch_path:
        description: 'Patch path inside NonGKI_Kernel_Build_2nd'
        required: false
        type: string
        default: 'Patches/Patch/susfs_patch_to_4.14.patch'

permissions:
  contents: read

jobs:
  stub:
    name: Select the ksun-susfs-JackA1ltman branch
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Wrong branch
        run: |
          echo "::error::This is only a stub. Re-run this workflow and select branch 'ksun-susfs-JackA1ltman'."
          exit 1
