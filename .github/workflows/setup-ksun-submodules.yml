name: Setup KernelSU-Next legacy submodules

# Run once from branch ksun-susfs-JackA1ltman. Replaces the BakaSU submodule at
# KernelSU/ with KernelSU-Next (branch legacy), adds JackA1ltman/NonGKI_Kernel_Build_2nd
# as a submodule and commits the result to this branch.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: setup-ksun-submodules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    name: Switch submodules
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout kernel (no submodules)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Replace BakaSU with KernelSU-Next legacy and add NonGKI_Kernel_Build_2nd
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          url="$(git config -f .gitmodules --get submodule.KernelSU.url || true)"
          if printf '%s' "$url" | grep -qi 'KernelSU-Next'; then
            echo "KernelSU already points at KernelSU-Next: $url"
          else
            echo "Replacing KernelSU submodule ($url)"
            git submodule deinit -f KernelSU || true
            git rm -f KernelSU
            rm -rf .git/modules/KernelSU KernelSU
            git submodule add -b legacy https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
          fi

          if git config -f .gitmodules --get submodule.NonGKI_Kernel_Build_2nd.url >/dev/null 2>&1; then
            echo 'NonGKI_Kernel_Build_2nd already present'
          else
            git submodule add https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git NonGKI_Kernel_Build_2nd
          fi

          git add .gitmodules KernelSU NonGKI_Kernel_Build_2nd
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi

          echo '--- .gitmodules ---'
          cat .gitmodules
          git submodule status | sed 's/^/  /'
          git commit -m 'kernelsu: switch to KernelSU-Next legacy; add NonGKI_Kernel_Build_2nd [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
